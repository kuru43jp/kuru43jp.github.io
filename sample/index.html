<div class="grid grid-cols-2 gap-3 text-center">
    <div class="bg-slate-950/60 rounded-xl p-3 border border-slate-800 flex flex-col justify-center">
        <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1">経過時間</span>
        <span id="timerDisplay" class="font-mono text-lg font-bold text-slate-100">00:00:00</span>
        <div class="mt-2 flex justify-center space-x-1">
            <button id="startTimerBtn" onclick="toggleTimer()" class="text-[10px] bg-emerald-600 hover:bg-emerald-500 text-white px-2 py-0.5 rounded font-bold">開始</button>
            <button onclick="resetTimer()" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded">RST</button>
        </div>
    </div>

    <div class="bg-slate-950/60 rounded-xl p-3 border border-slate-800 flex flex-col justify-center">
        <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1">時速 (経過時間基準)</span>
        <div class="flex items-baseline justify-center">
            <span id="catchRateDisplay" class="text-2xl font-extrabold text-amber-400">0.0</span>
            <span class="text-[10px] text-slate-400 ml-1">匹/h</span>
        </div>
    </div>
</div>
