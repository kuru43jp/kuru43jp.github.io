<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>タナゴ釣り大会 リアルタイム集計（GAS連携）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        .btn-active:active { transform: scale(0.96); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

    <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700 px-3 py-3 sticky top-0 z-20 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <div class="bg-emerald-500 text-slate-900 p-1.5 rounded-lg font-black text-xs">大会</div>
            <div>
                <h1 class="font-bold text-sm leading-tight tracking-wide">GASリアルタイム集計</h1>
                <p class="text-[10px] text-slate-400">Spreadsheet Connected</p>
            </div>
        </div>
        <div class="flex items-center space-x-1.5">
            <button onclick="openParticipantModal()" class="px-2.5 py-1.5 rounded-lg bg-emerald-600 text-white text-[11px] font-bold shadow">👥 選手管理</button>
            <button onclick="openRankingModal()" class="px-2.5 py-1.5 rounded-lg bg-amber-600 text-white text-[11px] font-bold shadow">🏆 順位速報</button>
        </div>
    </header>

    <main class="flex-grow max-w-md w-full mx-auto px-4 py-4 flex flex-col justify-between gap-4">
        <section class="bg-slate-800 rounded-2xl p-4 border border-slate-700/80 shadow-lg">
            <div class="flex items-center justify-between bg-slate-900/60 p-3 rounded-xl border border-slate-700/40">
                <div>
                    <span class="text-[10px] text-slate-400 uppercase font-bold block">集計中の選手</span>
                    <span id="currentParticipantName" class="text-base font-extrabold text-emerald-300">読み込み中...</span>
                </div>
                <button onclick="openParticipantModal()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg font-bold">選手変更 ▾</button>
            </div>
        </section>

        <section class="flex flex-col items-center my-auto w-full">
            <div class="flex w-full bg-slate-800 p-1 rounded-xl mb-4 border border-slate-700 space-x-1 shadow-inner">
                <button onclick="setTargetGender('male')" id="genderBtnMale" class="flex-1 py-2 rounded-lg text-xs font-bold transition flex items-center justify-center space-x-1 bg-blue-600/30 text-blue-300 border border-blue-500/50">
                    <span>♂ オス</span><span id="maleCountBadge" class="bg-blue-500 text-slate-900 px-1.5 py-0.2 rounded-full text-[10px] font-extrabold ml-1">0</span>
                </button>
                <button onclick="setTargetGender('female')" id="genderBtnFemale" class="flex-1 py-2 rounded-lg text-xs font-bold transition flex items-center justify-center space-x-1 text-slate-400">
                    <span>♀ メス</span><span id="femaleCountBadge" class="bg-pink-500 text-slate-900 px-1.5 py-0.2 rounded-full text-[10px] font-extrabold ml-1">0</span>
                </button>
                <button onclick="setTargetGender('unknown')" id="genderBtnUnknown" class="flex-1 py-2 rounded-lg text-xs font-bold transition flex items-center justify-center space-x-1 text-slate-400">
                    <span>? 不明</span><span id="unknownCountBadge" class="bg-slate-600 text-slate-100 px-1.5 py-0.2 rounded-full text-[10px] font-extrabold ml-1">0</span>
                </button>
            </div>

            <div class="relative w-full max-w-[260px] aspect-square my-2 flex items-center justify-center">
                <button onclick="incrementActiveParticipant()" class="btn-active w-full h-full rounded-full bg-gradient-to-br from-emerald-500 to-teal-700 text-slate-950 font-black shadow-2xl border-4 border-emerald-300/40 flex flex-col items-center justify-center relative active:brightness-110 select-none">
                    <span class="text-[11px] uppercase tracking-widest font-bold text-emerald-950/70 mb-1" id="activeGenderLabel">♂ オスをカウント</span>
                    <span id="giantCountNumber" class="text-7xl font-black tracking-tight drop-shadow-md">0</span>
                    <span class="mt-2 text-xs font-bold bg-slate-950/20 text-slate-900 px-3 py-1 rounded-full">TAP TO COUNT</span>
                </button>
            </div>

            <div class="flex items-center justify-center space-x-3 mt-4 w-full">
                <button onclick="decrementActiveParticipant()" class="btn-active flex-1 max-w-[150px] bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 py-2.5 px-4 rounded-xl text-xs font-bold shadow">➖ 1減らす (-1)</button>
            </div>
        </section>

        <section class="grid grid-cols-2 gap-3 mt-2">
            <button onclick="openRankingModal()" class="btn-active bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 px-4 rounded-xl text-sm shadow-lg flex items-center justify-center space-x-1"><span>🏆 ランキング確認</span></button>
            <button onclick="syncWithCloud()" class="btn-active bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-bold py-3 px-4 rounded-xl text-sm shadow flex items-center justify-center space-x-1"><span>🔄 データを同期</span></button>
        </section>
    </main>

    <!-- 選手管理モーダル -->
    <div id="participantModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-800/50">
                <h2 class="font-bold text-slate-100 text-sm">参加者（選手）の管理</h2>
                <button onclick="closeParticipantModal()" class="text-slate-400 hover:text-white text-lg px-2">✕</button>
            </div>
            <div class="p-4 space-y-3 overflow-y-auto flex-grow">
                <div class="flex space-x-2">
                    <input type="text" id="newParticipantInput" placeholder="選手名またはゼッケン番号..." class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 flex-grow">
                    <button onclick="addParticipant()" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-bold">追加</button>
                </div>
                <div id="participantList" class="space-y-2 mt-3"></div>
            </div>
            <div class="p-4 border-t border-slate-800 bg-slate-800/30 flex justify-end">
                <button onclick="closeParticipantModal()" class="bg-slate-700 text-slate-200 px-4 py-1.5 rounded-lg text-xs font-bold">完了</button>
            </div>
        </div>
    </div>

    <!-- ランキング速報モーダル -->
    <div id="rankingModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-800/50">
                <h2 class="font-bold text-slate-100 text-sm">🏆 リアルタイム釣果ランキング</h2>
                <button onclick="closeRankingModal()" class="text-slate-400 hover:text-white text-lg px-2">✕</button>
            </div>
            <div id="rankingList" class="p-4 overflow-y-auto space-y-2.5 flex-grow"></div>
            <div class="p-4 border-t border-slate-800 bg-slate-800/30 flex justify-between items-center">
                <button onclick="syncWithCloud()" class="text-xs font-semibold text-emerald-400">🔄 最新に更新</button>
                <button onclick="closeRankingModal()" class="bg-slate-700 text-slate-200 px-4 py-1.5 rounded-lg text-xs font-bold">閉じる</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-16 left-1/2 transform -translate-x-1/2 bg-slate-800 text-emerald-400 border border-emerald-500/40 px-4 py-2 rounded-full text-xs font-bold shadow-xl transition-opacity duration-300 opacity-0 pointer-events-none z-50">
        <span id="toastMsg">通知</span>
    </div>

    <script>
        // ★ ここに先ほど取得したGASのウェブアプリURLを貼り付けてください
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzZ_8j0Lsh6Ny3U9dPln9Icei3QWYjHqD9tPZSXw3Vr5W196brWp1aePkD77mBam7y3/exec";

        let tournamentData = {
            participants: [
                { id: 1, name: '選手 A', counts: { male: 0, female: 0, unknown: 0 } },
                { id: 2, name: '選手 B', counts: { male: 0, female: 0, unknown: 0 } }
            ],
            activeId: 1
        };

        let currentTargetGender = 'male';

        window.onload = () => {
            syncWithCloud(); // 起動時にスプレッドシートから最新データを取得
        };

        function ensureActiveParticipant() {
            if (tournamentData.participants.length > 0) {
                if (!tournamentData.participants.some(p => p.id === tournamentData.activeId)) {
                    tournamentData.activeId = tournamentData.participants[0].id;
                }
            } else {
                tournamentData.activeId = null;
            }
        }

        function getActiveParticipant() {
            return tournamentData.participants.find(p => p.id === tournamentData.activeId);
        }

        // --- GASとの通信（同期・保存） ---
        async function syncWithCloud() {
            showToast('クラウドから同期中...');
            try {
                const response = await fetch(GAS_API_URL);
                const data = await response.json();
                if (data && data.length > 0) {
                    // スプレッドシートのデータをアプリ用に変換
                    tournamentData.participants = data.map((item, idx) => ({
                        id: idx + 1,
                        name: item.name,
                        counts: item.counts
                    }));
                    ensureActiveParticipant();
                }
                updateUI();
                showToast('同期完了しました');
            } catch (err) {
                console.error(err);
                showToast('同期に失敗しました');
            }
        }

        async function saveToCloud() {
            try {
                await fetch(GAS_API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(tournamentData)
                });
            } catch (err) {
                console.error("保存エラー:", err);
            }
        }

        // --- カウント操作 ---
        function incrementActiveParticipant() {
            const p = getActiveParticipant();
            if (!p) { showToast('選手を登録してください'); openParticipantModal(); return; }
            p.counts[currentTargetGender]++;
            saveToCloud();
            updateUI();
            if ('vibrate' in navigator) navigator.vibrate(40);
        }

        function decrementActiveParticipant() {
            const p = getActiveParticipant();
            if (!p || p.counts[currentTargetGender] <= 0) return;
            p.counts[currentTargetGender]--;
            saveToCloud();
            updateUI();
            if ('vibrate' in navigator) navigator.vibrate(40);
        }

        function setTargetGender(g) {
            currentTargetGender = g;
            updateUI();
        }

        function getTotalCount(p) {
            return p.counts.male + p.counts.female + p.counts.unknown;
        }

        function updateUI() {
            ensureActiveParticipant();
            const p = getActiveParticipant();

            if (p) {
                document.getElementById('currentParticipantName').innerText = p.name;
                document.getElementById('maleCountBadge').innerText = p.counts.male;
                document.getElementById('femaleCountBadge').innerText = p.counts.female;
                document.getElementById('unknownCountBadge').innerText = p.counts.unknown;
                document.getElementById('giantCountNumber').innerText = p.counts[currentTargetGender];
            } else {
                document.getElementById('currentParticipantName').innerText = "選手がいません";
                document.getElementById('maleCountBadge').innerText = 0;
                document.getElementById('femaleCountBadge').innerText = 0;
                document.getElementById('unknownCountBadge').innerText = 0;
                document.getElementById('giantCountNumber').innerText = 0;
            }

            const gBtns = {
                male: document.getElementById('genderBtnMale'),
                female: document.getElementById('genderBtnFemale'),
                unknown: document.getElementById('genderBtnUnknown')
            };
            Object.keys(gBtns).forEach(k => gBtns[k].className = "flex-1 py-2 rounded-lg text-xs font-bold transition flex items-center justify-center space-x-1 text-slate-400");

            if (currentTargetGender === 'male') {
                gBtns.male.className = "flex-1 py-2 rounded-lg text-xs font-bold transition flex items-center justify-center space-x-1 bg-blue-600/30 text-blue-300 border border-blue-500/50";
                document.getElementById('activeGenderLabel').innerText = "♂ オスをカウント";
            } else if (currentTargetGender === 'female') {
                gBtns.female.className = "flex-1 py-2 rounded-lg text-xs font-bold transition flex items-center justify-center space-x-1 bg-pink-600/30 text-pink-300 border border-pink-500/50";
                document.getElementById('activeGenderLabel').innerText = "♀ メスをカウント";
            } else {
                gBtns.unknown.className = "flex-1 py-2 rounded-lg text-xs font-bold transition flex items-center justify-center space-x-1 bg-amber-600/30 text-amber-300 border border-amber-500/50";
                document.getElementById('activeGenderLabel').innerText = "? 不明をカウント";
            }
        }

        // --- 選手管理 ---
        function openParticipantModal() { renderParticipantList(); document.getElementById('participantModal').classList.remove('hidden'); }
        function closeParticipantModal() { document.getElementById('participantModal').classList.add('hidden'); updateUI(); }

        function renderParticipantList() {
            const container = document.getElementById('participantList');
            if (tournamentData.participants.length === 0) {
                container.innerHTML = `<div class="text-center py-4 text-xs text-slate-500">登録されている選手がいません</div>`;
                return;
            }
            container.innerHTML = tournamentData.participants.map(p => {
                const total = getTotalCount(p);
                const isActive = p.id === tournamentData.activeId;
                return `
                    <div class="bg-slate-800 border ${isActive ? 'border-emerald-500/80 bg-slate-800/90' : 'border-slate-700/60'} rounded-xl p-3 flex items-center justify-between text-xs">
                        <div>
                            <div class="font-bold text-slate-200 flex items-center space-x-2">
                                <span>${p.name}</span>
                                ${isActive ? '<span class="bg-emerald-500 text-slate-950 text-[10px] px-1.5 py-0.5 rounded font-black">集計中</span>' : ''}
                            </div>
                            <div class="text-slate-400 mt-0.5">合計: <b class="text-emerald-400">${total} 匹</b> (♂${p.counts.male}/♀${p.counts.female}/?${p.counts.unknown})</div>
                        </div>
                        <div class="space-x-1">
                            ${!isActive ? `<button onclick="switchParticipant(${p.id})" class="bg-emerald-600 text-white px-2 py-1 rounded font-bold">選択</button>` : ''}
                            <button onclick="deleteParticipant(${p.id})" class="bg-rose-600 text-white px-2 py-1 rounded font-bold">削除</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function addParticipant() {
            const input = document.getElementById('newParticipantInput');
            const name = input.value.trim();
            if (!name) { showToast('選手名を入力してください'); return; }
            
            const newId = Date.now();
            tournamentData.participants.push({ id: newId, name: name, counts: { male: 0, female: 0, unknown: 0 } });
            if (!tournamentData.activeId) tournamentData.activeId = newId;
            
            input.value = '';
            saveToCloud();
            renderParticipantList();
            updateUI();
            showToast(`${name} を追加しました`);
        }

        function switchParticipant(id) {
            tournamentData.activeId = id;
            renderParticipantList();
            updateUI();
            showToast('集計対象を変更しました');
        }

        function deleteParticipant(id) {
            if (confirm('この選手を削除しますか？')) {
                tournamentData.participants = tournamentData.participants.filter(p => p.id !== id);
                ensureActiveParticipant();
                saveToCloud();
                renderParticipantList();
                updateUI();
            }
        }

        // --- ランキング速報 ---
        async function openRankingModal() {
            await syncWithCloud(); // 開くときに最新をロード
            const container = document.getElementById('rankingList');
            const sorted = [...tournamentData.participants].sort((a, b) => getTotalCount(b) - getTotalCount(a));

            if (sorted.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-xs text-slate-500">ランキングデータがありません</div>`;
            } else {
                container.innerHTML = sorted.map((p, index) => {
                    const total = getTotalCount(p);
                    const rankClass = index === 0 ? 'text-amber-400 font-black' : index === 1 ? 'text-slate-300 font-bold' : index === 2 ? 'text-amber-700 font-bold' : 'text-slate-400';
                    return `
                        <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 flex items-center justify-between text-xs">
                            <div class="flex items-center space-x-3">
                                <span class="text-base w-6 text-center ${rankClass}">#${index + 1}</span>
                                <div>
                                    <div class="font-bold text-slate-200 text-sm">${p.name}</div>
                                    <div class="text-slate-400">♂ ${p.counts.male} / ♀ ${p.counts.female} / ? ${p.counts.unknown}</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="text-lg font-black text-emerald-400">${total}</span><span class="text-slate-400 text-[10px]"> 匹</span>
                            </div>
                        </div>
                    `;
                }).join('');
            }
            document.getElementById('rankingModal').classList.remove('hidden');
        }
        function closeRankingModal() { document.getElementById('rankingModal').classList.add('hidden'); }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            t.classList.remove('opacity-0');
            t.classList.add('opacity-100');
            setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 2000);
        }
    </script>
</body>
</html>
