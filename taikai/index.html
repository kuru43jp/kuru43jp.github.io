<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>タナゴ釣り大会 カウンター（音声読み上げ・スリープボタン付き）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans JP', sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            background-color: #020617;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .bg-photo-active::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.68);
            backdrop-filter: blur(1px);
            pointer-events: none;
            z-index: 0;
        }
        .btn-active:active { transform: scale(0.95); }
        .counter-circle {
            border-radius: 9999px;
            box-shadow: 0 12px 28px -6px rgba(16, 185, 129, 0.35), inset 0 2px 6px rgba(255, 255, 255, 0.25);
            transition: transform 0.1s ease, filter 0.1s ease;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.96); opacity: 0.7; }
            50% { transform: scale(1.03); opacity: 0.3; }
            100% { transform: scale(0.96); opacity: 0.7; }
        }
        .pulse-effect {
            animation: pulse-ring 3s infinite ease-in-out;
        }
    </style>
</head>
<body id="appBody" class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white relative">

    <!-- 画面ロック中のオーバーレイ -->
    <div id="screenLockOverlay" class="fixed inset-0 bg-slate-950/90 z-50 flex flex-col items-center justify-center hidden backdrop-blur-sm p-6 text-center">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl max-w-xs w-full space-y-4">
            <div class="text-4xl">🔒</div>
            <h2 class="font-bold text-base text-slate-100">画面ロック中</h2>
            <p class="text-xs text-slate-400">誤操作防止のためタッチが無効化されています。</p>
            <button onclick="toggleScreenLock()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-sm shadow">
                タップして解除
            </button>
        </div>
    </div>

    <!-- アプリ内スリープ（画面暗転・省電）オーバーレイ -->
    <div id="appSleepOverlay" onclick="wakeUpApp()" class="fixed inset-0 bg-black z-50 flex flex-col items-center justify-center hidden p-6 text-center cursor-pointer">
        <div class="text-slate-600 space-y-2">
            <div class="text-3xl animate-pulse">🌙</div>
            <p class="text-xs">タップして復帰</p>
        </div>
    </div>

    <header class="bg-slate-900/90 border-b border-slate-800 px-3 py-3 sticky top-0 z-20 flex items-center justify-between backdrop-blur-sm">
        <div class="flex items-center space-x-2">
            <div id="wakeLockBadge" class="bg-emerald-500 text-slate-950 p-1.5 rounded-lg font-black text-xs">常時</div>
            <div>
                <h1 class="font-bold text-sm leading-tight tracking-wide">タナゴ釣果カウンター</h1>
                <p id="wakeLockStatus" class="text-[10px] text-emerald-400">スリープ防止: 有効</p>
            </div>
        </div>
        <div class="flex items-center space-x-1">
            <button onclick="toggleVoice()" id="voiceToggleBtn" class="px-2 py-1.5 rounded-lg bg-emerald-950/80 border border-emerald-700/60 text-emerald-300 text-[10px] font-bold shadow">🔊音声:ON</button>
            <button onclick="goToAppSleep()" class="px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-[10px] font-bold shadow" title="画面を暗くして省電力">🌙スリープ</button>
            <button onclick="toggleWakeLock()" id="wakeLockToggleBtn" class="px-2 py-1.5 rounded-lg bg-emerald-950/80 border border-emerald-700/60 text-emerald-300 text-[10px] font-bold shadow">💡常時点灯ON</button>
            <button onclick="toggleScreenLock()" class="px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-[10px] font-bold shadow">🔒</button>
            <button onclick="openRankingModal()" class="px-2 py-1.5 rounded-lg bg-amber-600 text-white text-[10px] font-bold shadow">🏆</button>
        </div>
    </header>

    <main class="flex-grow max-w-md w-full mx-auto px-4 py-4 flex flex-col justify-between gap-4 relative z-10">
        
        <!-- 初回登録画面 -->
        <section id="setupSection" class="bg-slate-900/90 backdrop-blur-sm rounded-2xl p-6 border border-slate-800 shadow-lg my-auto hidden">
            <h2 class="font-bold text-base text-slate-100 mb-2">📱 端末の担当選手登録</h2>
            <p class="text-xs text-slate-400 mb-4">このスマートフォンで集計する選手名を入力してください。<br><span class="text-amber-400 font-bold">※「管理者」または「本部」と入力すると、初期化・大会時間設定機能が有効になります。</span></p>
            <div class="space-y-3">
                <input type="text" id="terminalParticipantInput" placeholder="例: 選手A / 管理者 / 本部" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                <button onclick="registerTerminalParticipant()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-sm shadow">この名前で決定して開始</button>
            </div>
        </section>

        <!-- メインカウント画面 -->
        <div id="mainSection" class="flex flex-col justify-between flex-grow gap-4">
            <section class="bg-slate-900/90 backdrop-blur-sm rounded-2xl p-4 border border-slate-800 shadow-lg flex flex-col gap-3">
                <div class="flex items-center justify-between">
                    <div>
                        <span class="text-[10px] text-slate-400 uppercase font-bold block">登録名（この端末）</span>
                        <span id="assignedParticipantName" class="text-base font-extrabold text-emerald-300">-</span>
                    </div>
                    <div class="flex items-center space-x-1.5">
                        <button onclick="triggerBgImagePicker()" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-emerald-300 px-2.5 py-1.5 rounded-lg font-bold">🖼 背景</button>
                        <button id="clearBgBtn" onclick="clearBgImage()" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-400 px-2 py-1.5 rounded-lg font-bold hidden">解除</button>
                        <button onclick="changeAssignedParticipant()" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg font-bold">名前変更</button>
                    </div>
                </div>
                <input type="file" id="bgImageInput" accept="image/*" class="hidden" onchange="handleBgImageChange(event)">

                <!-- 大会スケジュール・タイマー表示 -->
                <div class="bg-slate-950/90 border border-slate-800 rounded-xl p-2.5 space-y-2">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2">
                            <span id="scheduleStateBadge" class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-400">未設定</span>
                            <span id="scheduleRangeText" class="font-mono text-xs font-bold text-slate-200">--:-- 〜 --:--</span>
                        </div>
                        <span id="scheduleCountdownText" class="font-mono text-sm font-black text-amber-300">--:--</span>
                    </div>
                    <div id="adminScheduleControls" class="flex items-center justify-between gap-1.5 pt-1 border-t border-slate-800/80 hidden">
                        <button onclick="openScheduleModal()" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-amber-300 px-2 py-1 rounded font-bold">
                            🕒 時刻設定
                        </button>
                        <div class="flex items-center space-x-1">
                            <button id="adminStartBtn" onclick="manualStartTournament()" class="btn-active bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] font-bold px-2 py-1 rounded shadow">
                                ▶ 大会開始
                            </button>
                            <button id="adminEndBtn" onclick="manualEndTournament()" class="btn-active bg-rose-600 hover:bg-rose-500 text-white text-[10px] font-bold px-2 py-1 rounded shadow">
                                ⏹ 大会終了
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 中央の丸いカウントボタン -->
            <section class="flex flex-col items-center justify-center my-auto w-full space-y-4">
                <div class="relative w-56 h-56 flex items-center justify-center">
                    <div class="absolute inset-0 rounded-full bg-emerald-500/15 border border-emerald-400/30 pulse-effect pointer-events-none"></div>
                    <button id="mainCircleBtn" onclick="incrementCount()"
                            class="btn-active counter-circle w-full h-full bg-gradient-to-br from-emerald-500 via-emerald-600 to-teal-800 border-4 border-emerald-300/70 text-slate-950 flex flex-col items-center justify-center select-none active:brightness-110">
                        <span class="text-xs font-black tracking-widest uppercase text-emerald-950/90 mb-1">たなごちゃんです</span>
                        <span id="activeTotalDisplay" class="text-6xl font-mono font-black text-white drop-shadow-[0_2px_8px_rgba(0,0,0,0.45)]">0</span>
                        <span class="text-xs font-extrabold text-emerald-100 mt-1 bg-slate-950/35 px-3 py-0.5 rounded-full">匹</span>
                    </button>
                </div>

                <!-- マイナス調整ボタン -->
                <div class="flex items-center justify-center w-full max-w-xs pt-1">
                    <button onclick="decrementCount()" class="btn-active w-full bg-slate-900/90 hover:bg-slate-800 border border-slate-800 text-slate-300 py-2.5 px-4 rounded-xl text-xs font-bold shadow">
                        ➖ 1減らす (-1)
                    </button>
                </div>
            </section>

            <!-- アクションボタンエリア -->
            <section class="space-y-2 mt-2">
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="openRankingModal()" class="btn-active bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 px-4 rounded-xl text-sm shadow-lg flex items-center justify-center space-x-1"><span>🏆 ランキング</span></button>
                    <button onclick="syncWithCloud()" class="btn-active bg-slate-900/90 hover:bg-slate-800 border border-slate-800 text-emerald-400 font-bold py-3 px-4 rounded-xl text-sm shadow flex items-center justify-center space-x-1"><span>🔄 最新に同期</span></button>
                </div>
                <!-- 管理者用初期化ボタン（管理者・本部でのみ表示） -->
                <button id="adminClearBtn" onclick="clearCloudSpreadsheet()" class="w-full btn-active bg-rose-950/70 hover:bg-rose-900/70 border border-rose-900/60 text-rose-300 font-bold py-3 px-4 rounded-xl text-sm shadow hidden flex items-center justify-center space-x-1"><span>🗑️ スプレッドシート全データ初期化</span></button>
            </section>
        </div>
    </main>

    <!-- 大会開始・終了時刻設定モーダル -->
    <div id="scheduleModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xs p-5 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h2 class="font-bold text-slate-100 text-sm">🕒 大会開始・終了時刻設定</h2>
                <button onclick="closeScheduleModal()" class="text-slate-400 hover:text-white text-base px-1">✕</button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label for="startTimeInput" class="block text-slate-400 font-bold mb-1">大会開始時刻</label>
                    <input type="time" id="startTimeInput" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label for="endTimeInput" class="block text-slate-400 font-bold mb-1">大会終了時刻</label>
                    <input type="time" id="endTimeInput" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
                <p class="text-[11px] text-slate-400">指定時刻になると自動で開始・終了音声が流れます。</p>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-1">
                <button onclick="clearScheduleTimes()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-xs">クリア</button>
                <button onclick="saveScheduleTimes()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs shadow">保存</button>
            </div>
        </div>
    </div>

    <!-- ランキング速報モーダル -->
    <div id="rankingModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/50">
                <h2 class="font-bold text-slate-100 text-sm">🏆 リアルタイム釣果ランキング</h2>
                <button onclick="closeRankingModal()" class="text-slate-400 hover:text-white text-lg px-2">✕</button>
            </div>
            <div id="rankingList" class="p-4 overflow-y-auto space-y-2.5 flex-grow"></div>
            <div class="p-4 border-t border-slate-800 bg-slate-950/50 flex justify-between items-center">
                <button onclick="syncWithCloud()" class="text-xs font-semibold text-emerald-400">🔄 最新に更新</button>
                <button onclick="closeRankingModal()" class="bg-slate-800 text-slate-200 px-4 py-1.5 rounded-lg text-xs font-bold">閉じる</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-16 left-1/2 transform -translate-x-1/2 bg-slate-900 text-emerald-400 border border-slate-800 px-4 py-2 rounded-full text-xs font-bold shadow-xl transition-opacity duration-300 opacity-0 pointer-events-none z-50">
        <span id="toastMsg">通知</span>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxIAIE6DiCkN09j6AYFrMuXedNaB3-t1iQ8W5gHT9coTQb29yGzLb0MwF__k6CxGNwZ/exec";

        let assignedName = localStorage.getItem('tanago_assigned_name') || "";
        let tournamentData = { participants: [] };
        let wakeLock = null;
        let isWakeLockEnabled = true;

        // 大会開始・終了時刻スケジュール状態
        let scheduleStartTime = localStorage.getItem('tanago_schedule_start') || "";
        let scheduleEndTime = localStorage.getItem('tanago_schedule_end') || "";
        let tournamentPhase = "idle";
        let autoStartTriggeredForDay = "";
        let autoEndTriggeredForDay = "";

        // 背景画像状態
        let bgImageDataUrl = localStorage.getItem('tanago_bg_image') || "";

        // 音声読み上げ関連の設定
        let voiceEnabled = true;
        const NORMAL_VOLUME = 0.6;
        const HIGHLIGHT_VOLUME = 1.0;
        const AUDIO_POOL_SIZE = 4;

        const SOUND_FILES = {
            normal: './sounds/たなごちゃん.m4a',
            katame: './sounds/katame.m4a',
            ryome: './sounds/ryome.m4a',
            tsunuke: './sounds/tsunuke.m4a',
            '1soku': './sounds/1soku.m4a',
            '2soku': './sounds/2soku.m4a',
            '3soku': './sounds/3soku.m4a',
            '4soku': './sounds/4soku.m4a',
            '5soku': './sounds/5soku.m4a',
            start: './sounds/taikaikaisi.m4a',
            end: './sounds/taikaisyuryo.m4a'
        };

        const audioPools = {};
        const poolIndices = {};
        const loadErrors = {};

        function applyBgImage(dataUrl) {
            const body = document.getElementById('appBody');
            const clearBtn = document.getElementById('clearBgBtn');
            if (dataUrl) {
                body.style.backgroundImage = `url("${dataUrl}")`;
                body.classList.add('bg-photo-active');
                if (clearBtn) clearBtn.classList.remove('hidden');
            } else {
                body.style.backgroundImage = '';
                body.classList.remove('bg-photo-active');
                if (clearBtn) clearBtn.classList.add('hidden');
            }
        }

        function triggerBgImagePicker() {
            const input = document.getElementById('bgImageInput');
            if (input) {
                input.value = "";
                input.click();
            }
        }

        function handleBgImageChange(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                showToast('画像ファイルを選択してください');
                return;
            }
            const reader = new FileReader();
            reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                    const maxDim = 1280;
                    let width = img.width;
                    let height = img.height;
                    if (width > maxDim || height > maxDim) {
                        if (width >= height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressed = canvas.toDataURL('image/jpeg', 0.8);
                    try {
                        localStorage.setItem('tanago_bg_image', compressed);
                        bgImageDataUrl = compressed;
                        applyBgImage(bgImageDataUrl);
                        showToast('背景写真を設定しました');
                    } catch (err) {
                        bgImageDataUrl = compressed;
                        applyBgImage(bgImageDataUrl);
                        showToast('背景を反映しました（保存容量上限のため一時反映）');
                    }
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        }

        function clearBgImage() {
            bgImageDataUrl = "";
            localStorage.removeItem('tanago_bg_image');
            applyBgImage("");
            showToast('背景写真を解除しました');
        }

        function createAudioInstance(key, src) {
            const audio = new Audio(src);
            audio.preload = 'auto';
            audio.playsInline = true;
            audio.setAttribute('playsinline', '');
            audio.setAttribute('webkit-playsinline', '');
            audio.addEventListener('error', () => {
                loadErrors[key] = true;
                console.warn(`音声ファイル読み込みエラー [${key}]: ${src}`);
            });
            return audio;
        }

        function initAudioPools() {
            Object.keys(SOUND_FILES).forEach((key) => {
                audioPools[key] = [];
                poolIndices[key] = 0;
                loadErrors[key] = false;
                for (let i = 0; i < AUDIO_POOL_SIZE; i++) {
                    audioPools[key].push(createAudioInstance(key, SOUND_FILES[key]));
                }
            });
        }

        initAudioPools();

        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            const btn = document.getElementById('voiceToggleBtn');
            if (voiceEnabled) {
                btn.innerText = "🔊音声:ON";
                btn.className = "px-2 py-1.5 rounded-lg bg-emerald-950/80 border border-emerald-700/60 text-emerald-300 text-[10px] font-bold shadow";
                showToast("音声読み上げ：ON");
            } else {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
                btn.innerText = "🔇音声:OFF";
                btn.className = "px-2 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 text-[10px] font-bold shadow";
                showToast("音声読み上げ：OFF");
            }
        }

        function speakText(textToSpeak, isMilestone = false) {
            if (!voiceEnabled || !('speechSynthesis' in window)) return;
            try {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'ja-JP';
                utterance.rate = 1.1;
                utterance.pitch = 1.3;
                utterance.volume = isMilestone ? HIGHLIGHT_VOLUME : NORMAL_VOLUME;
                window.speechSynthesis.speak(utterance);
            } catch (e) {}
        }

        function playSoundKey(key, isMilestone = false, fallbackText = 'たなごちゃんです', fallbackKey = 'normal') {
            if (!voiceEnabled) return;
            try {
                const pool = audioPools[key];
                if (!pool || pool.length === 0 || loadErrors[key]) {
                    if (key !== fallbackKey && audioPools[fallbackKey] && !loadErrors[fallbackKey]) {
                        return playSoundKey(fallbackKey, isMilestone, fallbackText, fallbackKey);
                    }
                    speakText(fallbackText, isMilestone);
                    return;
                }

                const idx = poolIndices[key] || 0;
                const audio = pool[idx];
                poolIndices[key] = (idx + 1) % AUDIO_POOL_SIZE;

                if (audio.error) {
                    loadErrors[key] = true;
                    if (key !== fallbackKey && audioPools[fallbackKey] && !loadErrors[fallbackKey]) {
                        return playSoundKey(fallbackKey, isMilestone, fallbackText, fallbackKey);
                    }
                    speakText(fallbackText, isMilestone);
                    return;
                }

                if (audio.readyState === 0) {
                    audio.load();
                }

                audio.pause();
                audio.currentTime = 0;
                audio.volume = isMilestone ? HIGHLIGHT_VOLUME : NORMAL_VOLUME;

                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.catch(() => {
                        if (key !== fallbackKey && audioPools[fallbackKey] && !loadErrors[fallbackKey]) {
                            playSoundKey(fallbackKey, isMilestone, fallbackText, fallbackKey);
                        } else {
                            speakText(fallbackText, isMilestone);
                        }
                    });
                }
            } catch (e) {
                speakText(fallbackText, isMilestone);
            }
        }

        function getTodayKey(now = new Date()) {
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function parseTimeToTodayDate(hhmm, baseDate = new Date()) {
            if (!hhmm || !/^\d{2}:\d{2}$/.test(hhmm)) return null;
            const [h, m] = hhmm.split(':').map(Number);
            return new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate(), h, m, 0, 0);
        }

        function formatDurationMMSS(totalSec) {
            const safe = Math.max(0, Math.floor(totalSec));
            const mins = Math.floor(safe / 60);
            const secs = safe % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function openScheduleModal() {
            document.getElementById('startTimeInput').value = scheduleStartTime;
            document.getElementById('endTimeInput').value = scheduleEndTime;
            document.getElementById('scheduleModal').classList.remove('hidden');
        }

        function closeScheduleModal() {
            document.getElementById('scheduleModal').classList.add('hidden');
        }

        function saveScheduleTimes() {
            const startVal = document.getElementById('startTimeInput').value;
            const endVal = document.getElementById('endTimeInput').value;
            if (startVal && endVal && startVal >= endVal) {
                showToast('終了時刻は開始時刻より後に設定してください');
                return;
            }
            scheduleStartTime = startVal;
            scheduleEndTime = endVal;
            localStorage.setItem('tanago_schedule_start', scheduleStartTime);
            localStorage.setItem('tanago_schedule_end', scheduleEndTime);
            autoStartTriggeredForDay = "";
            autoEndTriggeredForDay = "";
            tournamentPhase = "idle";
            closeScheduleModal();
            updateScheduleUI();
            showToast('大会時刻を保存しました');
        }

        function clearScheduleTimes() {
            scheduleStartTime = "";
            scheduleEndTime = "";
            localStorage.removeItem('tanago_schedule_start');
            localStorage.removeItem('tanago_schedule_end');
            autoStartTriggeredForDay = "";
            autoEndTriggeredForDay = "";
            tournamentPhase = "idle";
            document.getElementById('startTimeInput').value = "";
            document.getElementById('endTimeInput').value = "";
            closeScheduleModal();
            updateScheduleUI();
            showToast('時刻設定をクリアしました');
        }

        function manualStartTournament() {
            const dayKey = getTodayKey();
            tournamentPhase = "running";
            autoStartTriggeredForDay = dayKey;
            updateScheduleUI();
            playSoundKey('start', true, '大会開始です', 'normal');
            showToast('📢 大会開始！');
        }

        function manualEndTournament() {
            const dayKey = getTodayKey();
            tournamentPhase = "ended";
            autoEndTriggeredForDay = dayKey;
            updateScheduleUI();
            playSoundKey('end', true, '大会終了です', 'normal');
            showToast('⏹ 大会終了！');
        }

        function checkScheduleTick() {
            const now = new Date();
            const dayKey = getTodayKey(now);
            const startDate = parseTimeToTodayDate(scheduleStartTime, now);
            const endDate = parseTimeToTodayDate(scheduleEndTime, now);

            if (startDate && now >= startDate && autoStartTriggeredForDay !== dayKey) {
                autoStartTriggeredForDay = dayKey;
                if (tournamentPhase !== "ended") {
                    tournamentPhase = "running";
                    playSoundKey('start', true, '大会開始です', 'normal');
                    showToast('📢 開始時刻になりました！');
                }
            }

            if (endDate && now >= endDate && autoEndTriggeredForDay !== dayKey) {
                autoEndTriggeredForDay = dayKey;
                tournamentPhase = "ended";
                playSoundKey('end', true, '大会終了です', 'normal');
                showToast('⏹ 終了時刻になりました！');
            }

            updateScheduleUI(now);
        }

        function updateScheduleUI(now = new Date()) {
            const rangeEl = document.getElementById('scheduleRangeText');
            const badgeEl = document.getElementById('scheduleStateBadge');
            const cdEl = document.getElementById('scheduleCountdownText');
            if (!rangeEl || !badgeEl || !cdEl) return;

            const startText = scheduleStartTime || "--:--";
            const endText = scheduleEndTime || "--:--";
            rangeEl.innerText = `${startText} 〜 ${endText}`;

            const startDate = parseTimeToTodayDate(scheduleStartTime, now);
            const endDate = parseTimeToTodayDate(scheduleEndTime, now);

            if (tournamentPhase === "ended") {
                badgeEl.innerText = "終了";
                badgeEl.className = "text-[10px] font-bold px-2 py-0.5 rounded bg-rose-950 text-rose-300 border border-rose-700/60";
                cdEl.innerText = "00:00";
                return;
            }

            if (tournamentPhase === "running" || (startDate && now >= startDate && (!endDate || now < endDate))) {
                badgeEl.innerText = "開催中";
                badgeEl.className = "text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-700/60";
                if (endDate) {
                    const diffSec = Math.max(0, Math.floor((endDate - now) / 1000));
                    cdEl.innerText = `残 ${formatDurationMMSS(diffSec)}`;
                } else {
                    cdEl.innerText = "進行中";
                }
                return;
            }

            if (startDate && now < startDate) {
                badgeEl.innerText = "開始待ち";
                badgeEl.className = "text-[10px] font-bold px-2 py-0.5 rounded bg-amber-950 text-amber-300 border border-amber-700/60";
                const diffSec = Math.max(0, Math.floor((startDate - now) / 1000));
                cdEl.innerText = `始 ${formatDurationMMSS(diffSec)}`;
                return;
            }

            badgeEl.innerText = "待機中";
            badgeEl.className = "text-[10px] font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-400";
            cdEl.innerText = "--:--";
        }

        function speakTanagoForTotal(totalCount) {
            if (!voiceEnabled) return;

            if (totalCount === 1) {
                playSoundKey('katame', true, 'かためです', 'normal');
                return;
            }
            if (totalCount === 2) {
                playSoundKey('ryome', true, 'りょうめです', 'normal');
                return;
            }
            if (totalCount === 10) {
                playSoundKey('tsunuke', true, 'つぬけです', 'normal');
                return;
            }
            if (totalCount === 100) {
                playSoundKey('1soku', true, '1そくです', 'normal');
                return;
            }
            if (totalCount === 200) {
                playSoundKey('2soku', true, '2そくです', 'normal');
                return;
            }
            if (totalCount === 300) {
                playSoundKey('3soku', true, '3そくです', 'normal');
                return;
            }
            if (totalCount === 400) {
                playSoundKey('4soku', true, '4そくです', 'normal');
                return;
            }
            if (totalCount === 500) {
                playSoundKey('5soku', true, '5そくです', 'normal');
                return;
            }
            if (totalCount === 503) {
                speakText('ごー丸さんです', true);
                return;
            }
            if (totalCount >= 150 && totalCount % 50 === 0) {
                const soku = Math.floor(totalCount / 100);
                const isHan = (totalCount % 100) === 50;
                const numbers = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
                const sokuStr = soku <= 10 ? numbers[soku] + 'そく' : soku + 'そく';
                const textToSpeak = isHan ? `${sokuStr}はんです` : `${sokuStr}です`;
                speakText(textToSpeak, true);
                return;
            }

            playSoundKey('normal', false, 'たなごちゃんです', 'normal');
        }

        window.onload = () => {
            applyBgImage(bgImageDataUrl);
            updateScheduleUI();
            setInterval(checkScheduleTick, 1000);
            checkTerminalSetup();
            requestWakeLock();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
            }
        };

        function goToAppSleep() {
            document.getElementById('appSleepOverlay').classList.remove('hidden');
        }

        function wakeUpApp() {
            document.getElementById('appSleepOverlay').classList.add('hidden');
        }

        async function toggleWakeLock() {
            if (isWakeLockEnabled) {
                if (wakeLock !== null) {
                    try {
                        await wakeLock.release();
                        wakeLock = null;
                    } catch (err) {
                        console.error(err);
                    }
                }
                isWakeLockEnabled = false;
                document.getElementById('wakeLockStatus').innerText = "スリープ防止: 停止中";
                document.getElementById('wakeLockToggleBtn').innerText = "💡常時点灯OFF";
                document.getElementById('wakeLockToggleBtn').className = "px-2 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 text-[10px] font-bold shadow";
                document.getElementById('wakeLockBadge').className = "bg-slate-700 text-slate-300 p-1.5 rounded-lg font-black text-xs";
                showToast('スリープ防止をOFFにしました');
            } else {
                isWakeLockEnabled = true;
                await requestWakeLock();
                document.getElementById('wakeLockToggleBtn').innerText = "💡常時点灯ON";
                document.getElementById('wakeLockToggleBtn').className = "px-2 py-1.5 rounded-lg bg-emerald-950/80 border border-emerald-700/60 text-emerald-300 text-[10px] font-bold shadow";
                document.getElementById('wakeLockBadge').className = "bg-emerald-500 text-slate-950 p-1.5 rounded-lg font-black text-xs";
                showToast('スリープ防止をONにしました');
            }
        }

        async function requestWakeLock() {
            if (!isWakeLockEnabled) return;
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    document.getElementById('wakeLockStatus').innerText = "スリープ防止: 有効";
                    
                    document.addEventListener('visibilitychange', async () => {
                        if (isWakeLockEnabled && wakeLock !== null && document.visibilityState === 'visible') {
                            wakeLock = await navigator.wakeLock.request('screen');
                        }
                    });
                } catch (err) {
                    console.error(`${err.name}, ${err.message}`);
                    document.getElementById('wakeLockStatus').innerText = "スリープ防止: 非対応/解除";
                }
            } else {
                document.getElementById('wakeLockStatus').innerText = "スリープ防止: 非対応ブラウザ";
            }
        }

        function isAdmin() {
            return assignedName === "管理者" || assignedName === "本部";
        }

        function toggleScreenLock() {
            const overlay = document.getElementById('screenLockOverlay');
            overlay.classList.toggle('hidden');
            if (!overlay.classList.contains('hidden')) {
                showToast('画面をロックしました');
            } else {
                showToast('ロックを解除しました');
            }
        }

        async function checkTerminalSetup() {
            if (!assignedName) {
                document.getElementById('setupSection').classList.remove('hidden');
                document.getElementById('mainSection').classList.add('hidden');
            } else {
                document.getElementById('setupSection').classList.add('hidden');
                document.getElementById('mainSection').classList.remove('hidden');
                document.getElementById('assignedParticipantName').innerText = assignedName;

                const clearBtn = document.getElementById('adminClearBtn');
                const scheduleControls = document.getElementById('adminScheduleControls');
                if (isAdmin()) {
                    clearBtn.classList.remove('hidden');
                    scheduleControls.classList.remove('hidden');
                } else {
                    clearBtn.classList.add('hidden');
                    scheduleControls.classList.add('hidden');
                }

                await syncWithCloud();
            }
        }

        async function registerTerminalParticipant() {
            const input = document.getElementById('terminalParticipantInput');
            const name = input.value.trim();
            if (!name) {
                showToast('名前を入力してください');
                return;
            }
            assignedName = name;
            localStorage.setItem('tanago_assigned_name', assignedName);
            
            ensureAssignedInCloud();
            await checkTerminalSetup();
            showToast(`${assignedName} として登録しました`);
        }

        function changeAssignedParticipant() {
            if (confirm("この端末の登録名を変更しますか？")) {
                localStorage.removeItem('tanago_assigned_name');
                assignedName = "";
                checkTerminalSetup();
            }
        }

        function ensureAssignedInCloud() {
            let p = tournamentData.participants.find(item => item.name === assignedName);
            if (!p) {
                tournamentData.participants.push({
                    name: assignedName,
                    counts: { male: 0, female: 0, unknown: 0 }
                });
                saveToCloud();
            } else if (!p.counts) {
                p.counts = { male: 0, female: 0, unknown: 0 };
            }
        }

        function getMyParticipant() {
            let p = tournamentData.participants.find(item => item.name === assignedName);
            if (!p) {
                p = { name: assignedName, counts: { male: 0, female: 0, unknown: 0 } };
                tournamentData.participants.push(p);
            } else if (!p.counts) {
                p.counts = { male: 0, female: 0, unknown: 0 };
            }
            return p;
        }

        async function syncWithCloud() {
            showToast('同期中...');
            try {
                const response = await fetch(GAS_API_URL);
                const data = await response.json();
                if (data && Array.isArray(data)) {
                    tournamentData.participants = data.map(item => ({
                        name: item.name,
                        counts: item.counts || { male: 0, female: 0, unknown: 0 }
                    }));
                }
                ensureAssignedInCloud();
                updateUI();
                showToast('同期完了');
            } catch (err) {
                console.error("同期エラー:", err);
                showToast('同期失敗');
            }
        }

        async function saveToCloud() {
            try {
                await fetch(GAS_API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(tournamentData)
                });
            } catch (err) {
                console.error("保存エラー:", err);
            }
        }

        function incrementCount() {
            const p = getMyParticipant();
            p.counts.unknown = (p.counts.unknown || 0) + 1;
            const total = getTotalCount(p);
            saveToCloud();
            updateUI();
            speakTanagoForTotal(total);
            if ('vibrate' in navigator) navigator.vibrate(30);
        }

        function decrementCount() {
            const p = getMyParticipant();
            if ((p.counts.unknown || 0) > 0) {
                p.counts.unknown--;
            } else if ((p.counts.female || 0) > 0) {
                p.counts.female--;
            } else if ((p.counts.male || 0) > 0) {
                p.counts.male--;
            } else {
                return;
            }
            saveToCloud();
            updateUI();
            if ('vibrate' in navigator) navigator.vibrate(30);
        }

        function getTotalCount(p) {
            if (!p || !p.counts) return 0;
            return (p.counts.male || 0) + (p.counts.female || 0) + (p.counts.unknown || 0);
        }

        function updateUI() {
            const p = getMyParticipant();
            document.getElementById('activeTotalDisplay').innerText = getTotalCount(p);
        }

        async function openRankingModal() {
            await syncWithCloud();
            const container = document.getElementById('rankingList');
            const sorted = [...tournamentData.participants]
                .filter(p => p.name !== "管理者" && p.name !== "本部")
                .sort((a, b) => getTotalCount(b) - getTotalCount(a));

            if (sorted.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-xs text-slate-500">データがありません</div>`;
            } else {
                container.innerHTML = sorted.map((p, index) => {
                    const total = getTotalCount(p);
                    const rankClass = index === 0 ? 'text-amber-400 font-black' : index === 1 ? 'text-slate-300 font-bold' : index === 2 ? 'text-amber-700 font-bold' : 'text-slate-400';
                    return `
                        <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 flex items-center justify-between text-xs">
                            <div class="flex items-center space-x-3">
                                <span class="text-base w-6 text-center ${rankClass}">#${index + 1}</span>
                                <div class="font-bold text-slate-200 text-sm">${p.name}</div>
                            </div>
                            <div class="text-right">
                                <span class="text-lg font-black text-emerald-400">${total}</span><span class="text-slate-400 text-[10px]"> 匹</span>
                            </div>
                        </div>
                    `;
                }).join('');
            }
            document.getElementById('rankingModal').classList.remove('hidden');
        }
        function closeRankingModal() { document.getElementById('rankingModal').classList.add('hidden'); }

        async function clearCloudSpreadsheet() {
            if (!isAdmin()) {
                alert("権限がありません");
                return;
            }
            if (!confirm("本当にスプレッドシートの全データを初期化しますか？")) return;
            try {
                await fetch(GAS_API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "clear" })
                });
                tournamentData.participants = [];
                ensureAssignedInCloud();
                updateUI();
                showToast('初期化しました');
            } catch (err) {
                showToast('初期化失敗');
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            t.classList.remove('opacity-0');
            t.classList.add('opacity-100');
            setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 1500);
        }
    </script>
</body>
</html>
